name: Python and publishing checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: make setup
      - run: make test
      - run: make check-secrets-history
      - run: make contracts && git diff --exit-code contracts/
      - run: make audit
  # Watch build and runtime tests use the licensed local Garmin SDK/device package.
  # Run make build-watch && make test-watch on the Mac before a release.
