name: Python and publishing checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: make setup
      - run: make test
      - run: make check-secrets-history
      - run: make contracts && git diff --exit-code contracts/
      - run: make audit
  # Watch build and runtime tests use the licensed local Garmin SDK/device package.
  # Run make build-watch && make test-watch on the Mac before a release.
